<div class="container-fluid mt-4 px-md-4">
  <div class="d-flex align-items-center mb-3 px-1">
    <div class="d-flex align-items-center gap-2 flex-grow-1">
      <h5 class="mb-0 fw-bold text-primary">
        <i class="bi bi-funnel-fill me-2" style="-webkit-text-stroke: 0.3px;"></i>Filtreleme Seçenekleri
      </h5>
      <div class="flex-grow-1 ms-3 border-bottom border-primary" style="opacity: 0.2;"></div>
    </div>
  </div>

  <div class="card shadow-sm mb-4 border-0 bg-white">
    <div class="card-body p-4">
      <div class="row g-3 align-items-end">
        
        <div class="col-12 col-md-6 col-lg-3">
          <label for="adSoyad" class="small fw-bold text-muted mb-1">Adı Soyadı</label>
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-white border-secondary-subtle text-muted"><i class="bi bi-search" style="-webkit-text-stroke: 0.3px;"></i></span>
            <input id="adSoyad" type="text" class="form-control shadow-none border-secondary-subtle border-start-0" placeholder="İsim ile ara..." [(ngModel)]="filterCriteria.adSoyad" (input)="applyFilter()">
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
          <label for="email" class="small fw-bold text-muted mb-1">Email</label>
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-white border-secondary-subtle text-muted"><i class="bi bi-envelope" style="-webkit-text-stroke: 0.3px;"></i></span>
            <input id="email" type="text" class="form-control shadow-none border-secondary-subtle border-start-0" placeholder="Email ile ara..." [(ngModel)]="filterCriteria.email" (input)="applyFilter()">
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-2">
          <label for="rol" class="small fw-bold text-muted mb-1">Rol</label>
          <select id="rol" class="form-select form-select-sm shadow-none border-secondary-subtle" [(ngModel)]="filterCriteria.rol" (change)="applyFilter()">
            <option value="">Tümü</option>
            <option value="Admin">Admin</option>
            <option value="User">User</option>
          </select>
        </div>

        <div class="col-12 col-lg-4">
          <div class="d-flex justify-content-end align-items-center gap-2 flex-wrap">
            <button class="btn btn-sm btn-outline-secondary px-3 shadow-none border-secondary-subtle" (click)="resetFilters()" title="Filtreleri Sıfırla">
              <i class="bi bi-arrow-counterclockwise" style="-webkit-text-stroke: 0.3px;"></i> Sıfırla
            </button>
            <div class="btn-group btn-group-sm shadow-none border rounded">
              <button class="btn btn-white px-3" (click)="exportExcel()">
                <i class="bi bi-file-earmark-excel text-success me-1" style="-webkit-text-stroke: 0.3px;"></i>Excel
              </button>
              <button class="btn btn-white px-3" (click)="exportPdf()">
                <i class="bi bi-file-earmark-pdf text-danger me-1" style="-webkit-text-stroke: 0.3px;"></i>PDF
              </button>
            </div>
            <button class="btn btn-sm btn-primary px-4 shadow-none fw-medium" routerLink="/core/admin/add">
              <i class="bi bi-plus-lg me-1" style="-webkit-text-stroke: 0.5px;"></i> Yeni Kayıt
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-3 px-1">
    <div class="d-flex align-items-center gap-2 flex-grow-1">
      <h5 class="mb-0 fw-bold text-primary text-nowrap">
        <i class="bi bi-person me-2" style="-webkit-text-stroke: 0.3px;"></i>Kullanıcı Listesi
      </h5>
      <span *ngIf="selectedUsers.length > 0" class="badge bg-primary rounded-pill">{{ selectedUsers.length }} Seçili</span>
      <div class="flex-grow-1 ms-3 border-bottom border-primary" style="opacity: 0.2;"></div>
    </div>

    <div class="btn-group shadow-sm ms-3">
      <button class="btn btn-sm btn-light border px-3" (click)="goToUpdate()" title="Güncelle">
        <i class="bi bi-pencil-fill" [ngClass]="selectedUsers.length === 1 ? 'text-primary' : 'text-secondary'" style="-webkit-text-stroke: 0.3px;"></i>
      </button>
      <button class="btn btn-sm btn-light border px-3" (click)="deleteSelected()" title="Sil">
        <i class="bi bi-trash3-fill" [ngClass]="selectedUsers.length > 0 ? 'text-danger' : 'text-secondary'" style="-webkit-text-stroke: 0.3px;"></i>
      </button>
    </div>
  </div>

  <div class="table-responsive rounded shadow-sm bg-white border border-light-subtle">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light">
        <tr>
          <th style="width: 50px;"><input class="form-check-input ms-1 shadow-none" type="checkbox" [checked]="isAllSelected()" (change)="toggleSelectAll($event)" /></th>
          <th class="small text-uppercase fw-bold text-dark" style="font-size: 0.75rem;">Id</th>
          <th class="small text-uppercase fw-bold text-dark" style="font-size: 0.75rem;">Adı Soyadı</th>
          <th class="small text-uppercase fw-bold text-dark" style="font-size: 0.75rem;">Email</th>
          <th class="small text-uppercase fw-bold text-dark text-center" style="font-size: 0.75rem;">Rol</th>
        </tr>
      </thead>
      <tbody style="font-size: 0.85rem; color: #222;">
        <tr *ngFor="let user of filteredUsers">
          <td><input class="form-check-input ms-1 shadow-none" type="checkbox" [checked]="isSelected(user)" (change)="toggleUser(user)" /></td>
          <td class="text-dark fw-medium small">{{ user.id }}</td>
          <td class="fw-bold text-dark">{{ user.adSoyad }}</td>
          <td class="text-dark fw-medium">{{ user.email }}</td>
          <td class="text-center">
            <span class="badge rounded-pill px-3 py-2 fw-bold border shadow-none" [ngClass]="user.rol === 'Admin' ? 'bg-danger-subtle text-danger border-danger-subtle' : 'bg-light text-dark border-secondary-subtle'">
              {{ user.rol }}
            </span>
          </td>
        </tr>
        <tr *ngIf="filteredUsers.length === 0">
          <td colspan="5" class="text-center py-5 text-muted fst-italic">Kriterlere uygun kullanıcı bulunamadı.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="mt-3 px-1">
    <div class="small text-dark fw-bold text-uppercase" style="font-size: 0.7rem; letter-spacing: 0.5px;">
      Toplam Kullanıcı: <span class="text-primary fs-6">{{ filteredUsers.length }}</span>
    </div>
  </div>
</div>
