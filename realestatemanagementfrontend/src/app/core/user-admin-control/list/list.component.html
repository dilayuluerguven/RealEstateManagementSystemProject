<div class="container-fluid mt-4 px-md-4">
  <div class="card shadow-sm mb-4 border-0 bg-white">
    <div class="card-body py-3">
      <div class="d-flex flex-column flex-lg-row align-items-center justify-content-between gap-3">
        
        <div class="d-flex flex-column flex-md-row align-items-center gap-3 w-100">
          <h5 class="mb-0 fw-bold d-flex align-items-center gap-2 text-nowrap">
            <i class="bi bi-person-lines-fill text-primary"></i>
            Kullanıcı Listesi
          </h5>

          <div class="position-relative w-100" style="max-width: 350px;">
            <i class="bi bi-search position-absolute text-muted" 
               style="top: 50%; left: 12px; transform: translateY(-50%); font-size: 0.85rem"></i>
            <input
              type="text"
              class="form-control form-control-sm ps-5 py-2 border-secondary-subtle shadow-none"
              placeholder="Ad, Email veya Rol ara..."
              [(ngModel)]="filterText"
              (input)="applyFilter()"
            />
          </div>
        </div>

        <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-end gap-2 w-100">
          
          <div class="btn-group shadow-sm">
            <button
              type="button"
              class="btn btn-sm btn-outline-primary px-3"
              (click)="goToUpdate()"
              [disabled]="selectedUsers.length !== 1"
              title="Güncelle"
            >
              <i class="bi bi-pencil-fill"></i>
            </button>
            <button
              type="button"
              class="btn btn-sm btn-outline-danger px-3"
              (click)="deleteSelected()"
              [disabled]="selectedUsers.length === 0"
              title="Sil"
            >
              <i class="bi bi-trash3-fill"></i>({{ selectedUsers.length }})
            </button>
          </div>

          <div class="btn-group shadow-sm">
            <button type="button" class="btn btn-sm btn-outline-success border-success-subtle px-3 d-flex align-items-center gap-1" (click)="exportExcel()">
              <i class="bi bi-file-earmark-excel"></i>
              <span class="fw-medium">Excel</span>
            </button>
            <button type="button" class="btn btn-sm btn-outline-danger border-danger-subtle px-3 d-flex align-items-center gap-1" (click)="exportPdf()">
              <i class="bi bi-file-earmark-pdf"></i>
              <span class="fw-medium">PDF</span>
            </button>
          </div>

          <button type="button" class="btn btn-primary btn-sm px-3 shadow-sm d-flex align-items-center gap-1" routerLink="/core/admin/add">
            <i class="bi bi-plus-lg"></i>
            <span class="text-nowrap fw-medium">Yeni</span>
          </button>
        </div>

      </div>
    </div>
  </div>

  <div class="table-responsive rounded shadow-sm bg-white border">
    <table class="table table-bordered table-hover align-middle mb-0">
      <thead class="table-light">
        <tr>
          <th class="text-nowrap" style="width: 50px;">
            <input
              class="form-check-input ms-1"
              type="checkbox"
              [checked]="isAllSelected()"
              (change)="toggleSelectAll($event)"
            />
          </th>
          <th class="small text-uppercase fw-bold">Id</th>
          <th class="small text-uppercase fw-bold">Adı Soyadı</th>
          <th class="small text-uppercase fw-bold">Email</th>
          <th class="small text-uppercase fw-bold text-center">Rol</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let user of filteredUsers">
          <td>
            <input
              class="form-check-input ms-1"
              type="checkbox"
              [checked]="isSelected(user)"
              (change)="toggleUser(user)"
            />
          </td>
          <td class="text-muted small">{{ user.id }}</td>
          <td class="fw-medium">{{ user.adSoyad }}</td>
          <td>{{ user.email }}</td>
          <td class="text-center">
            <span
              class="badge rounded-pill px-3 py-2 fw-normal border"
              [ngClass]="user.rol === 'Admin' ? 'bg-danger-subtle text-danger border-danger-subtle' : 'bg-light text-dark'"
            >
              {{ user.rol }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="mt-3 px-1">
    <span class="badge bg-white text-dark border py-2 px-3 rounded-3 shadow-sm">
      Seçili kullanıcı: <strong class="text-primary">{{ selectedUsers.length }}</strong>
    </span>
  </div>
</div>
