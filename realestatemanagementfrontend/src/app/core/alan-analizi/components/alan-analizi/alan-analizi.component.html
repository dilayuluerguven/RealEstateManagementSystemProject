<div class="map-wrapper vh-100 overflow-hidden position-relative">
  <div id="map" class="w-100 h-100 bg-light"></div>

  <div class="position-absolute top-0 start-0 m-3 z-3" style="width: 260px;">
    <div class="card shadow-sm border-0 opacity-95">
      <div class="card-body p-3">
        <h6 class="fw-bold mb-3 d-flex align-items-center">
          <i class="bi bi-geo-alt-fill text-primary me-2"></i> Alan Analizi
        </h6>

        <select class="form-select form-select-sm mb-3 border-light-subtle" [(ngModel)]="seciliGeometri" (change)="geometriDegisti()">
          <option value="A">Katman A</option>
          <option value="B">Katman B</option>
          <option value="C">Katman C</option>
        </select>

        <div class="d-grid gap-2">
          <button class="btn btn-primary btn-sm fw-semibold" (click)="kaydetABC()">Kaydet</button>
          
          <div class="d-flex gap-1">
            <button class="btn btn-outline-dark btn-sm flex-fill" (click)="kesisim()">A ∩ B</button>
            <button class="btn btn-outline-dark btn-sm flex-fill" (click)="birlesimAB()">A ∪ B</button>
          </div>
          
          <button class="btn btn-outline-dark btn-sm" (click)="birlesimABC()">A ∪ B ∪ C</button>
          
          <hr class="my-2 opacity-25">

          <div class="btn-group btn-group-sm w-100">
            <button class="btn btn-light border" (click)="sadeceGoster('A')">A</button>
            <button class="btn btn-light border" (click)="sadeceGoster('B')">B</button>
            <button class="btn btn-light border" (click)="sadeceGoster('C')">C</button>
            <button class="btn btn-light border" (click)="ilkHaliGoster()">Tümü</button>
          </div>

          <button class="btn btn-link btn-sm text-danger text-decoration-none mt-2" (click)="hepsiniTemizle()">
            Haritayı Sıfırla
          </button>
        </div>
      </div>
    </div>

    <div class="card shadow-sm border-0 mt-3 opacity-95">
      <div class="card-header bg-white py-2 small fw-bold text-muted border-0">Özet Veriler</div>
      <div class="list-group list-group-flush small">
        <div *ngFor="let g of ['A','B','C','D','E']" class="list-group-item d-flex justify-content-between align-items-center py-2 border-light-subtle bg-transparent">
          <span class="fw-bold">{{ g }}</span>
          <span class="text-primary fw-semibold">{{ (getGeometriVerisi(g)?.alanMetrekare || 0) | number:'1.0-0' }} m²</span>
          <i class="bi bi-circle-fill" [class.text-success]="getGeometriVerisi(g)" [class.text-light]="!getGeometriVerisi(g)" style="font-size: 8px;"></i>
        </div>

        <div class="list-group-item d-flex justify-content-between align-items-center py-2 border-light-subtle bg-info-subtle" *ngIf="sonuc?.mesaj?.includes('Kesişim')">
          <span class="fw-bold text-info">F (A ∩ B)</span>
          <span class="text-info fw-bold">{{ (sonuc?.alan || 0) | number:'1.0-0' }} m²</span>
          <i class="bi bi-eye-fill text-info" style="font-size: 10px;"></i>
        </div>
      </div>
    </div>
  </div>

  <div class="position-absolute bottom-0 start-50 translate-middle-x mb-4 z-3">
    <div class="badge rounded-pill bg-dark py-2 px-3 opacity-75 shadow-sm">
      <i class="bi bi-info-circle me-1"></i> Haritada çizim yapın ve kaydedin.
    </div>
  </div>
</div>
