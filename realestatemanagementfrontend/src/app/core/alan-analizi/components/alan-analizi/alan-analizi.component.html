<div class="panel">
  <select class="select" [(ngModel)]="geometriAdi">
    <option value="A">A</option>
    <option value="B">B</option>
    <option value="C">C</option>
  </select>

  <button class="btn primary" (click)="kaydet()">Kaydet</button>
  <button class="btn" (click)="kesisim()">Kesişim (A-B)</button>
  <button class="btn" (click)="birlesimAB()">Birleşim (A+B)</button>
  <button class="btn" (click)="birlesimABC()">Birleşim (A+B+C)</button>
</div>

<div id="map" class="map-container"></div>

<pre>{{ sonuc | json }}</pre>
