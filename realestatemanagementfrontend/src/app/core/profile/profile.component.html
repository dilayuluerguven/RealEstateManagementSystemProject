<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h5 class="mb-0 fw-semibold">
      <i class="bi bi-person-gear me-1 text-primary"></i>
      Profil Bilgilerimi Güncelle
    </h5>

    <button
      class="btn btn-outline-secondary btn-sm"
      routerLink="/core/tasinmaz/list"
      type="button"
    >
      <i class="bi bi-arrow-left me-1"></i>
      Listeye Dön
    </button>
  </div>

  <form *ngIf="profileForm"
      [formGroup]="profileForm"
      (ngSubmit)="updateProfile()">

    <div class="mb-3">
      <label class="form-label fw-semibold">
        Ad Soyad <span class="text-danger">*</span>
      </label>
      <input
        class="form-control"
        formControlName="adSoyad"
        placeholder="Ad Soyad"
      />
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">
        Email <span class="text-danger">*</span>
      </label>
      <input
        type="email"
        class="form-control"
        formControlName="email"
        placeholder="Email adresi"
      />
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold">Yeni Şifre</label>

      <div class="input-group">
        <input
          class="form-control"
          formControlName="sifre"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Değiştirmek istemiyorsanız boş bırakın"
        />

        <button
          type="button"
          class="btn btn-outline-secondary"
          (click)="togglePassword()"
        >
          <i
            class="bi"
            [ngClass]="showPassword ? 'bi-eye' : 'bi-eye-slash'"
          ></i>
        </button>
      </div>
    </div>
    <div class="d-flex justify-content-end">
      <button
        type="submit"
        class="btn btn-success px-4"
        [disabled]="profileForm.invalid"
      >
        <i class="bi bi-save me-1"></i>
        Güncelle
      </button>
    </div>
  </form>
</div>
