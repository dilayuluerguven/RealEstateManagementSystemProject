<div
  class="position-absolute bottom-0 end-0 mb-4 me-3 bg-white bg-opacity-95 shadow rounded-4 p-2 px-3"
  style="z-index:1000; min-width:160px"
>
  <label for="opacityRange" class="small fw-bold text-muted d-block text-center mb-1">
    Harita Opaklığı
  </label>

  <input
    id="opacityRange"
    type="range"
    min="0"
    max="1"
    step="0.1"
    class="form-range"
    [(ngModel)]="opacity"
    (input)="opacityChange.emit(opacity)"
  />
</div>
