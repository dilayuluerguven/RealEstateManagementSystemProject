<div class="map-ui-panel">
  <div class="opacity-control">
    <i class="bi bi-layers"></i>
    <input
      type="range"
      min="0"
      max="1"
      step="0.1"
      [(ngModel)]="baseOpacity"
      (ngModelChange)="onBaseOpacityChange()"
    />
  </div>

  <div class="area-operations">
    <button
      class="btn btn-outline-dark btn-sm"
      (click)="calculateUnion()"
      [disabled]="!canCalculate"
      title="Birleşim (A ∪ B)"
    >
      A ∪ B
    </button>

    <button
      class="btn btn-outline-danger btn-sm"
      (click)="calculateIntersection()"
      [disabled]="!canCalculate"
      title="Kesişim (A ∩ B)"
    >
      A ∩ B
    </button>
  </div>
</div>

<div id="list-map" class="map-container"></div>

<div
  id="map-tooltip"
  class="map-tooltip"
  [style.display]="tooltipVisible ? 'block' : 'none'"
>
  {{ tooltipText }}
</div>
